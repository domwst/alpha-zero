<!doctype html>
<html lang="en" data-density="compact">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Play Gomoku against a trained AlphaZero network and inspect how MCTS changes its policy."
    />
    <title>AlphaZero Playground</title>
    <link
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2317171c'/%3E%3Ccircle cx='12.5' cy='12.5' r='6.5' fill='%23f5f5f4'/%3E%3Ccircle cx='20.5' cy='20.5' r='6.5' fill='%235b9cf5'/%3E%3C/svg%3E"
      rel="icon"
    />
    <script>
      (() => {
        try {
          const saved = localStorage.getItem('alz-playground-theme');
          if (saved === 'light' || saved === 'dark')
            document.documentElement.dataset.theme = saved;
        } catch { /* storage unavailable — theme follows the host */ }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <noscript>
      <p style="font-family: system-ui, sans-serif; padding: 2rem; text-align: center;">
        AlphaZero Playground needs JavaScript to render the board and stream search updates.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
