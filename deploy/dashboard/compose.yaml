name: alz-dashboard

services:
  dashboard:
    image: alz-dashboard-archive:local
    build:
      context: .
    network_mode: host
    user: "${DASHBOARD_UID:-1000}:${DASHBOARD_GID:-1000}"
    init: true
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 1g
    working_dir: /app
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    volumes:
      - ../../scripts:/app/scripts:ro
      - ../../web/dist:/app/web/dist:ro
      - type: bind
        source: ../../runs/dashboard-local/data
        target: /data
        bind:
          create_host_path: false
    command:
      - -m
      - scripts.job_service.server
      - --root
      - /data
      - --assets
      - /app/web/dist
      - --listen
      - 127.0.0.1
      - --port
      - "${DASHBOARD_LOCAL_PORT:-8765}"
      - --read-only
      - --demo-url
      - "${DASHBOARD_DEMO_URL:-https://gomoku.oleja.dev}"
    healthcheck:
      test: [CMD, python3, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:${DASHBOARD_LOCAL_PORT:-8765}/api/v1/session', timeout=5).read()"]
      interval: 30s
      timeout: 6s
      start_period: 10s
      retries: 3
    logging:
      driver: local
      options:
        max-size: 5m
        max-file: "3"
