[package]
name = "pytorch"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow = { version = "1", features = ["backtrace"] }
atomic_refcell = "0.1.14"
futures = "0.3"
image = "0.25"
rand = { version = "0.10" }
rand_distr = "0.6"
serde = "1"
serde-big-array = "0.5.1"
serde_json = "1.0"
tap = "1.0.1"
tch = "0.26"
tokio = { version = "1", features = ["full"] }
unzip3 = "1.0.0"
