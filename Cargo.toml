[package]
name = "alz"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow = { version = "1", features = ["backtrace"] }
atomic_refcell = "0.1.14"
bincode = "1.3"
futures = "0.3"
image = "0.25"
rand = { version = "0.10" }
rand_distr = "0.6"
serde = { version = "1", features = ["derive"] }
serde-big-array = "0.5.1"
serde_json = "1.0"
tch = { git = "https://github.com/domwst/tch-rs", rev = "fb7bfda737de9d6657de5750456ec01492892ed1" }
tokio = { version = "1", features = ["full"] }
zstd = "0.13"
