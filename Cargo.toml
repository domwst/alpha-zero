[package]
name = "alz"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = { version = "1", features = ["backtrace"] }
bincode = "1.3"
clap = { version = "4.5", features = ["derive"] }
futures = "0.3"
image = "0.25"
rand = { version = "0.10" }
rand_distr = "0.6"
serde = { version = "1", features = ["derive"] }
serde-big-array = "0.5.1"
serde_json = "1.0"
sha2 = "0.10"
tch = { git = "https://github.com/domwst/tch-rs", rev = "fb7bfda737de9d6657de5750456ec01492892ed1" }
time = { version = "0.3", features = ["formatting", "macros"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "time"] }
zstd = "0.13"

[profile.release]
debug = 2
